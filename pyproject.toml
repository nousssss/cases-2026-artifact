[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "conas"
version = "0.1.0"
description = "CONAS: Compiler Optimization with Neural Architecture Search for operator-level convolution replacement"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy>=1.23", "matplotlib>=3.6"]

[project.optional-dependencies]
vision = ["torchvision>=0.15"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["conas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
